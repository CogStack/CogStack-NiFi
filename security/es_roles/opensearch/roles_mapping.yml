# In this file users, backendroles and hosts can be mapped to Security roles.
# Permissions for OpenSearch roles are configured in roles.yml

_meta:
  type: "rolesmapping"
  config_version: 2

admin:
  reserved: true
  backend_roles:
  - admin
  hosts: []
  users:
  - admin
  and_backend_roles: []

dashboards_system_access:
  users:
    - "admin"
  backend_roles:
    - "admin"
    - "all_access"

all_access:
  reserved: true
  hidden: false
  backend_roles:
  - "admin"
  hosts: []
  users: [ "admin" ]
  and_backend_roles: [""]
  description: "Maps admin to all_access"

# Grant the current administrator ML Commons access and provide a backend role
# that can be assigned to dedicated ML API/UI users.
ml_full_access:
  reserved: false
  hidden: false
  backend_roles:
  - "ml_full_access"
  hosts: []
  users:
  - "admin"
  and_backend_roles: []
  description: "Maps ML administrators to ml_full_access"

# Companion role required by OpenSearch 3.x when system-index permissions are
# enabled. Keep its users/backend roles aligned with ml_full_access above.
cogstack_ml_full_access:
  reserved: false
  hidden: false
  backend_roles:
  - "ml_full_access"
  hosts: []
  users:
  - "admin"
  and_backend_roles: []
  description: "Allows ML Commons APIs to access their protected system indices"

# Read-only ML users can inspect models, connectors, tasks, and statistics.
ml_read_access:
  reserved: false
  hidden: false
  backend_roles:
  - "ml_read_access"
  hosts: []
  users: []
  and_backend_roles: []
  description: "Maps ML observers to ml_read_access"

own_index:
  reserved: false
  hidden: false
  backend_roles: []
  hosts: []
  users:
  - "*"
  and_backend_roles: []
  description: "Allow full access to an index named like the username"

logstash:
  reserved: false
  backend_roles:
  - "logstash"

kibana_user:
  reserved: false
  backend_roles:
  - "kibanauser"
  description: "Maps kibanauser to kibana_user"

readall:
  reserved: true
  hidden: false
  backend_roles:
    - "readall"
  hosts: []
  users: []
  and_backend_roles: []

manage_snapshots:
  reserved: true
  hidden: false
  backend_roles:
  - "snapshotrestore"
  hosts: []
  users: []
  and_backend_roles: []

kibana_server:
  reserved: true
  hidden: false
  backend_roles: []
  hosts: []
  users: ["kibanaserver"]
  and_backend_roles: []

# sample role
complex-role:
  reserved: false
  hidden: false
  backend_roles:
  - "ldap-analyst"
  hosts: []
  users:
  - "new-user"
  and_backend_roles: []
