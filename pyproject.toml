[tool.ruff]
line-length = 120
exclude = ["nifi/user_scripts/legacy_scripts", "services"]
target-version = "py311"
indent-width = 4

[tool.uv]
required-version = "==0.12.1"

[tool.ruff.lint]
# Enable flake8-bugbear (`B`) rules, in addition to the defaults.
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

fixable = ["ALL"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
ignore_missing_imports = true
strict = false
files = "."
mypy_path = "./typings/"
warn_unused_configs = true

[tool.setuptools.packages.find]
include = ["nifi*"]
exclude = [
    "*egg-info*",
    "build*",
    "dist*",
    "nifi/conf*",
    "nifi/drivers*",
    "nifi/user_schemas*",
    "nifi/user_templates*",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[project]
name = "cogstack_nifi"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "avro==1.12.2",
    "bokeh==3.8.2",
    "dill>=0.4.0,<1.0.0",
    "elasticsearch9==9.1.0",
    "fhir.resources==8.3.0",
    "geocoder==1.38.1",
    "jsonpickle==4.1.1",
    "mysql-connector-python==26.7.0",
    "neo4j==5.28.2",
    "nipyapi==1.7.0",
    "nltk==3.10.3",
    "numpy==2.4.2",
    "opensearch-py==3.0.0",
    "overrides==7.0.0",
    "pandas==2.3.3",
    "polars==1.44.1",
    "psycopg[binary,c]==3.3.5",
    "py4j==0.10.9.9",
    "py7zr==1.1.3",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.14.2",
    "pydicom==3.0.2",
    "pymssql==2.3.9",
    "PyYAML==6.0.3",
    "rancoord==0.0.6",
    "requests==2.33.0",
    "snowflake==1.13.1",
    "snowflake-connector-python==4.7.2",
    "wheel==0.46.2",
    "xlsxwriter==3.2.9",
    "xnat==0.8.1",
]

[dependency-groups]
dev = [
    "mypy==1.17.0",
    "mypy-extensions==1.1.0",
    "ruff==0.12.12",
    "timeout-decorator==0.5.0",
    "types-aiofiles==24.1.0.20250708",
    "types-PyYAML==6.0.12.20250516",
    "types-setuptools==80.9.0.20250529",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
