version: 2
updates:
  # Keep GitHub Actions (in .github/workflows) up to date
  - package-ecosystem: "github-actions"
    directory: "/"  # this is correct even if workflows are in .github/workflows
    schedule:
      interval: "weekly"

  # Keep the owned NiFi Dockerfile base image up to date.
  - package-ecosystem: "docker"
    directory: "/nifi"
    schedule:
      interval: "weekly"
    registries:
      - dockerhub

  # Keep the root Python project and lock file up to date.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keep the documentation project and lock file up to date.
  - package-ecosystem: "uv"
    directory: "/docs"
    schedule:
      interval: "weekly"

registries:
  dockerhub:
    type: "docker-registry"
    url: "https://index.docker.io"
    username: "${{secrets.DOCKER_HUB_USERNAME}}"
    password: "${{secrets.DOCKER_HUB_ACCESS_TOKEN}}"
