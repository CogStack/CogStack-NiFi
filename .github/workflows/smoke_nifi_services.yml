name: smoke-nifi-services

on:
  push:
    branches: ['**']
    paths: &paths
      - ".github/workflows/smoke_nifi_services.yml"
      - ".gitattributes"
      - "deploy/Makefile"
      - "deploy/export_env_vars.sh"
      - "deploy/config_files.sh"
      - "deploy/*.env"
      - "security/env/*.env"
      - "security/scripts/**"
      - "security/templates/**"
      - ".dockerignore"
      - "nifi/**"
      - "pyproject.toml"
      - "uv.lock"
      - "services/nginx/**"
      - "deploy/services.dev.yml"
      - "scripts/tests/check_nifi_resources.py"
      - "scripts/tests/smoke_nifi_services.sh"
      - "scripts/tests/smoke_http_checks.sh"
      - "!**/*.md"
      - "!**/README*"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Build and smoke-test NiFi services
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate certificates
        working-directory: security/scripts
        run: |
          set -euo pipefail
          ./create_root_ca_cert.sh
          ./create_nifi_certs.sh

      - name: Smoke tests
        run: |
          set -euo pipefail
          ./scripts/tests/smoke_nifi_services.sh

      - name: Dump container logs
        if: failure()
        run: |
          set -euo pipefail
          source deploy/export_env_vars.sh
          set -euo pipefail
          docker compose -f deploy/services.dev.yml ps
          docker compose -f deploy/services.dev.yml logs --no-color nifi nifi-nginx

      - name: Shutdown stack
        if: always()
        run: |
          set -euo pipefail
          source deploy/export_env_vars.sh
          set -euo pipefail
          docker compose -f deploy/services.dev.yml down -v
