name: submodules-pinned

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify recorded submodule commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Initialize recorded commits
        run: ./scripts/git_init_submodules_in_repo.sh

      - name: Verify recursive checkout
        shell: bash
        run: |
          set -euo pipefail
          status="$(git submodule status --recursive)"
          printf '%s\n' "$status"
          if grep -Eq '^[-+U]' <<< "$status"; then
            echo "Submodules do not match the recorded commits." >&2
            exit 1
          fi

      - name: Test initialization and explicit upgrades
        run: python3 -B -m unittest discover -s scripts/tests -p test_submodule_checkout.py -v
