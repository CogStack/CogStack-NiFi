name: smoke-elastic-services

on:
  push:
    branches: ['**']
    paths: &paths
      - ".github/workflows/smoke_elastic_services.yml"
      - ".gitattributes"
      - "deploy/Makefile"
      - "deploy/export_env_vars.sh"
      - "deploy/config_files.sh"
      - "deploy/*.env"
      - "security/env/*.env"
      - "security/scripts/**"
      - "security/templates/**"
      - "deploy/services.yml"
      - "services/elasticsearch/**"
      - "services/kibana/**"
      - "security/es_roles/**"
      - "scripts/tests/check_opensearch_settings.py"
      - "scripts/tests/smoke_elastic_services.sh"
      - "scripts/tests/smoke_http_checks.sh"
      - "!**/*.md"
      - "!**/README*"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke-test Elasticsearch cluster and Kibana
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate certificates
        working-directory: security/scripts
        run: |
          set -euo pipefail
          ./create_root_ca_cert.sh
          ./create_opensearch_node_cert.sh elasticsearch-1 elasticsearch-2 elasticsearch-3
          ./create_opensearch_client_admin_certs.sh

      - name: Start Elasticsearch cluster
        run: |
          set -euo pipefail
          make -C deploy start-elastic-cluster

      - name: Start Kibana
        run: |
          set -euo pipefail
          make -C deploy start-kibana

      - name: Smoke tests
        env:
          ELASTICSEARCH_SMOKE_START_SERVICES: "0"
        run: |
          set -euo pipefail
          ./scripts/tests/smoke_elastic_services.sh

      - name: Dump container logs
        if: failure()
        run: |
          set -euo pipefail
          source deploy/export_env_vars.sh
          docker compose -f deploy/services.yml ps
          docker compose -f deploy/services.yml logs --no-color elasticsearch-1 elasticsearch-2 elasticsearch-3 kibana

      - name: Shutdown stack
        if: always()
        run: |
          set -euo pipefail
          source deploy/export_env_vars.sh
          docker compose -f deploy/services.yml down -v
