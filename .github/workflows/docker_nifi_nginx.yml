name: docker-nifi-nginx

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
    paths: &paths
      - ".github/workflows/docker_nifi_nginx.yml"
      - ".github/workflows/_docker_template.yml"
      - ".gitattributes"
      - "services/nginx/**"
      - "!**/*.md"
      - "!**/README*"
  pull_request:
    paths: *paths
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_docker_template.yml
    with:
      image: cogstacksystems/nifi-nginx
      context: services/nginx
      dockerfile: services/nginx/Dockerfile
      cache_scope: nifi-nginx
    secrets: inherit
