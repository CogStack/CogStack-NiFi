name: compose-config

on:
  push:
    branches: ['**']
    paths:
      - "deploy/*.env"
      - "deploy/export_env_vars.sh"
      - "deploy/config_files.sh"
      - "deploy/Makefile"
      - "security/scripts/**"
      - "scripts/opensearch-ai-init.sh"
      - "scripts/tests/check_nifi_resources.py"
      - "scripts/tests/test_configuration.py"
      - "scripts/tests/test_nifi_runtime.py"
      - "scripts/tests/check_opensearch_settings.py"
      - "scripts/tests/test_opensearch_deployment.py"
      - "services/elasticsearch/**"
      - "services/cogstack-db/**"
      - "services/pgsamples/**"
      - "scripts/tests/test_database_deployment_security.py"
      - "scripts/tests/test_postgres_certificates.py"
      - "scripts/tests/test_postgres_initialization.py"
      - "scripts/tests/test_mssql_initialization.py"
      - "services/kibana/config/opensearch.yml"
      - "security/templates/**"
      - "security/es_roles/opensearch/**"
      - "scripts/tests/test_opensearch_ai_init.py"
      - "deploy/services*.yml"
      - "deploy/kubernetes/**"
      - "nifi/Dockerfile"
      - "nifi/docker/**"
      - "services/nginx/Dockerfile"
      - "services/ollama-openai-proxy/Dockerfile"
      - "scripts/tests/check_deployment_images.py"
      - "scripts/tests/test_deployment_images.py"
      - "security/env/*.env"
      - ".github/workflows/compose_config.yml"
  pull_request:
    paths:
      - "deploy/*.env"
      - "deploy/export_env_vars.sh"
      - "deploy/config_files.sh"
      - "deploy/Makefile"
      - "security/scripts/**"
      - "scripts/opensearch-ai-init.sh"
      - "scripts/tests/check_nifi_resources.py"
      - "scripts/tests/test_configuration.py"
      - "scripts/tests/test_nifi_runtime.py"
      - "scripts/tests/check_opensearch_settings.py"
      - "scripts/tests/test_opensearch_deployment.py"
      - "services/elasticsearch/**"
      - "services/cogstack-db/**"
      - "services/pgsamples/**"
      - "scripts/tests/test_database_deployment_security.py"
      - "scripts/tests/test_postgres_certificates.py"
      - "scripts/tests/test_postgres_initialization.py"
      - "scripts/tests/test_mssql_initialization.py"
      - "services/kibana/config/opensearch.yml"
      - "security/templates/**"
      - "security/es_roles/opensearch/**"
      - "scripts/tests/test_opensearch_ai_init.py"
      - "deploy/services*.yml"
      - "deploy/kubernetes/**"
      - "nifi/Dockerfile"
      - "nifi/docker/**"
      - "services/nginx/Dockerfile"
      - "services/ollama-openai-proxy/Dockerfile"
      - "scripts/tests/check_deployment_images.py"
      - "scripts/tests/test_deployment_images.py"
      - "security/env/*.env"
      - ".github/workflows/compose_config.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Compose and Kubernetes configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Java for certificate generation tests
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install deployment test dependency
        run: python3 -m pip install PyYAML==6.0.3

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1

      - name: Validate Compose files
        shell: bash
        run: |
          make -C deploy check-config

      - name: Verify deployment image pins
        run: python3 -B scripts/tests/check_deployment_images.py --helm

      - name: Test image drift checks
        run: python3 -B -m unittest discover -s scripts/tests -p test_deployment_images.py -v

      - name: Test configuration profiles and resource guards
        run: python3 -B -m unittest discover -s scripts/tests -p test_configuration.py -v

      - name: Test NiFi upstream settings, persistence and credential isolation
        run: python3 -B scripts/tests/test_nifi_runtime.py -v

      - name: Test database bootstrap and credential isolation
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_*initialization.py' -v
          python3 -B scripts/tests/test_database_deployment_security.py
          python3 -B scripts/tests/test_postgres_certificates.py

      - name: Test OpenSearch AI configuration
        run: python3 -B -m unittest discover -s scripts/tests -p test_opensearch_ai_init.py -v

      - name: Test OpenSearch Compose and Helm compatibility
        run: python3 -B -m unittest discover -s scripts/tests -p test_opensearch_deployment.py -v
