name: compose-config

on:
  push:
    branches: ['**']
    paths:
      - "deploy/*.env"
      - "deploy/export_env_vars.sh"
      - "deploy/services*.yml"
      - "deploy/charts/**"
      - "deploy/helm/**"
      - "nifi/Dockerfile"
      - "services/nginx/Dockerfile"
      - "services/ollama-openai-proxy/Dockerfile"
      - "scripts/tests/check_deployment_images.py"
      - "scripts/tests/test_deployment_images.py"
      - "security/env/*.env"
      - ".github/workflows/compose_config.yml"
  pull_request:
    paths:
      - "deploy/*.env"
      - "deploy/export_env_vars.sh"
      - "deploy/services*.yml"
      - "deploy/charts/**"
      - "deploy/helm/**"
      - "nifi/Dockerfile"
      - "services/nginx/Dockerfile"
      - "services/ollama-openai-proxy/Dockerfile"
      - "scripts/tests/check_deployment_images.py"
      - "scripts/tests/test_deployment_images.py"
      - "security/env/*.env"
      - ".github/workflows/compose_config.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1

      - name: Validate Compose files
        shell: bash
        run: |
          set -euo pipefail
          source deploy/export_env_vars.sh
          docker compose -f deploy/services.yml config --quiet
          docker compose -f deploy/services.dev.yml config --quiet

      - name: Verify deployment image pins
        run: python3 -B scripts/tests/check_deployment_images.py --helm

      - name: Test image drift checks
        run: python3 -B -m unittest discover -s scripts/tests -p test_deployment_images.py -v
