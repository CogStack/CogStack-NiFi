name: python-quality

on:
  push:
    branches: ['**']
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "nifi/**/*.py"
      - "scripts/**/*.py"
      - "typings/**/*.pyi"
      - ".github/workflows/python_quality.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "nifi/**/*.py"
      - "scripts/**/*.py"
      - "typings/**/*.pyi"
      - ".github/workflows/python_quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff + MyPy
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version-file: "pyproject.toml"

      - name: Install locked project dependencies
        run: |
          uv sync --locked --dev

      - name: Ruff (critical rules)
        run: |
          uv run --locked ruff check scripts nifi/user_python_extensions --select F,E9

      - name: MyPy
        run: |
          uv run --locked mypy --config-file pyproject.toml nifi/user_python_extensions scripts
