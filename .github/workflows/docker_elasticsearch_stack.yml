name: docker-elasticsearch-stack

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
    paths: &paths
      - ".github/workflows/docker_elasticsearch_stack.yml"
      - ".github/workflows/_docker_template.yml"
      - ".gitattributes"
      - "services/elasticsearch/**"
      - "services/kibana/**"
      - "!**/*.md"
      - "!**/README*"
  pull_request:
    paths: *paths
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elasticsearch:
    uses: ./.github/workflows/_docker_template.yml
    with:
      image: cogstacksystems/elasticsearch
      context: services/elasticsearch
      dockerfile: services/elasticsearch/Dockerfile_native
      cache_scope: elasticsearch
    secrets: inherit

  kibana:
    uses: ./.github/workflows/_docker_template.yml
    with:
      image: cogstacksystems/kibana
      context: services/kibana
      dockerfile: services/kibana/Dockerfile_native
      cache_scope: kibana
    secrets: inherit
