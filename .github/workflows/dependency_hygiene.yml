name: dependency-hygiene

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday UTC
  pull_request:
    paths:
      - "docs/pyproject.toml"
      - "docs/uv.lock"
      - "nifi/requirements.txt"
      - "nifi/requirements-dev.txt"
      - "scripts/maintenance/audit_pip_dependency.sh"
      - ".github/workflows/dependency_hygiene.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('docs/pyproject.toml', 'docs/uv.lock', 'nifi/requirements.txt', 'nifi/requirements-dev.txt', 'scripts/maintenance/audit_pip_dependency.sh') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install audit tools
        run: python -m pip install --upgrade pip pip-audit uv

      - name: Ensure script is executable
        run: chmod +x scripts/maintenance/audit_pip_dependency.sh

      - name: Run dependency audit
        run: ./scripts/maintenance/audit_pip_dependency.sh --include-nifi
