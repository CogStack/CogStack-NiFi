name: smoke-gitea-service

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke-test Gitea service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate certificates
        run: |
          set -euo pipefail
          make -C deploy init-security-gitea
          sudo chown 1000:1000 security/certificates/gitea/gitea.key
          sudo chmod 600 security/certificates/gitea/gitea.key

      - name: Start Gitea service
        run: |
          set -euo pipefail
          make -C deploy start-git-ea

      - name: Smoke tests
        env:
          GITEA_SMOKE_START_SERVICES: "0"
        run: |
          set -euo pipefail
          ./scripts/tests/smoke_gitea_service.sh

      - name: Dump container logs
        if: failure()
        run: |
          set -euo pipefail
          source deploy/export_env_vars.sh
          docker compose -f deploy/services.yml ps
          docker compose -f deploy/services.yml logs --no-color gitea

      - name: Shutdown stack
        if: always()
        run: |
          set -euo pipefail
          source deploy/export_env_vars.sh
          docker compose -f deploy/services.yml down -v
