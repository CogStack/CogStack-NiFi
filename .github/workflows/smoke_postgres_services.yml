name: smoke-postgres-services

on:
  push:
    branches: ['**']
    paths: &paths
      - ".github/workflows/smoke_postgres_services.yml"
      - ".gitattributes"
      - "deploy/Makefile"
      - "deploy/export_env_vars.sh"
      - "deploy/config_files.sh"
      - "deploy/*.env"
      - "security/env/*.env"
      - "security/scripts/**"
      - "security/templates/**"
      - "deploy/services.yml"
      - "services/pgsamples"
      - "services/pgsamples/**"
      - "scripts/tests/smoke_postgres_services.sh"
      - "!**/*.md"
      - "!**/README*"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke-test samples Postgres service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate PostgreSQL certificates
        run: |
          set -euo pipefail
          make -C deploy init-security-postgresql

      - name: Start samples database
        run: |
          set -euo pipefail
          make -C deploy start-samples

      - name: Smoke tests
        env:
          POSTGRES_SMOKE_START_SERVICES: "0"
        run: |
          set -euo pipefail
          ./scripts/tests/smoke_postgres_services.sh

      - name: Dump container logs
        if: failure()
        run: |
          set -euo pipefail
          source deploy/export_env_vars.sh
          docker compose -f deploy/services.yml ps
          docker compose -f deploy/services.yml logs --no-color samples-db

      - name: Shutdown stack
        if: always()
        run: |
          set -euo pipefail
          source deploy/export_env_vars.sh
          docker compose -f deploy/services.yml down -v
