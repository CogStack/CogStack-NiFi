name: docker-nifi

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
    paths: &paths
      - ".github/workflows/docker_nifi.yml"
      - ".github/workflows/_docker_template.yml"
      - ".gitattributes"
      - ".dockerignore"
      - "nifi/**"
      - "pyproject.toml"
      - "uv.lock"
      - "!**/*.md"
      - "!**/README*"
  pull_request:
    paths: *paths
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_docker_template.yml
    with:
      image: cogstacksystems/cogstack-nifi
      context: .
      dockerfile: nifi/Dockerfile
      cache_scope: nifi
    secrets: inherit
