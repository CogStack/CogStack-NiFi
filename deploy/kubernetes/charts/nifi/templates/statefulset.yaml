apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cogstack-nifi

spec:
  serviceName: cogstack-nifi
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: cogstack-nifi
  template:
    metadata:
      labels:
        app: cogstack-nifi
      annotations:
        checksum/tls-config: {{ include (print $.Template.BasePath "/tls-configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: nifi
          envFrom:
            - configMapRef:
                name: nifi-env
            - configMapRef:
                name: cogstack-nifi-tls-env

          volumeMounts:
            - name: tls
              mountPath: /certificates
              readOnly: true

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.nifi.internalPort | int }}
          resources: 
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:
        - name: tls
          projected:
            sources:
              - secret:
                  name: {{ .Values.certificates.rootCASecret }}
                  items:
                    - key: ca.crt
                      path: root/root-ca.pem
                    - key: truststore.jks
                      path: nifi/nifi-truststore.jks
              - secret:
                  name: {{ .Values.certificates.existingSecret }}
                  items:
                    - key: nifi-keystore.jks
                      path: nifi/nifi-keystore.jks
