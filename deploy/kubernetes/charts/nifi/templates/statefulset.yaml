apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cogstack-nifi

spec:
  serviceName: cogstack-nifi
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: cogstack-nifi
  template:
    metadata:
      labels:
        app: cogstack-nifi
    spec:
      containers:
        - name: nifi
          envFrom:
            - configMapRef:
                name: nifi-env 

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.nifi.internalPort | int }}
          resources: 
            {{- toYaml .Values.resources | nindent 12 }}

