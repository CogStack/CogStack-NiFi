nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: cogstacksystems/cogstack-nifi
  tag: latest
  digest: sha256:f3f0ce9c23f9e503042f646675ddef372acda5cffc2491f07a38996a95a948dd
  pullPolicy: IfNotPresent


podAnnotations: {}
podLabels: {}

securityContext:
  allowPrivilegeEscalation: false

nifi:
  internalPort: ${NIFI_INTERNAL_PORT}
  outputPort: ${NIFI_OUTPUT_PORT}

resources:
  requests:
    cpu: "${NIFI_DOCKER_CPU_MIN}"
    memory: "${NIFI_DOCKER_RAM}"
  limits:
    cpu: "${NIFI_DOCKER_CPU_MAX}"
    memory: "${NIFI_DOCKER_RAM}"

terminationGracePeriodSeconds: 120

