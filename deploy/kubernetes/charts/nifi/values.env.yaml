nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: cogstacksystems/cogstack-nifi
  tag: "latest"
  pullPolicy: Always


podAnnotations: {}
podLabels: {}

securityContext:
  allowPrivilegeEscalation: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: ${NIFI_UID}
  runAsGroup: ${NIFI_GID}
  fsGroup: ${NIFI_GID}
  fsGroupChangePolicy: OnRootMismatch

nifi:
  internalPort: ${NIFI_INTERNAL_PORT}
  outputPort: ${NIFI_OUTPUT_PORT}

certificates:
  # Shared CA only: ca.crt and truststore.jks; never the root private-key keystore.
  rootCASecret: cogstack-root-ca
  # NiFi's JKS contains its certificate and private key; the CA truststore is shared.
  existingSecret: nifi-tls

persistence:
  # null uses the cluster default; "" selects no StorageClass (pre-provisioned PVs).
  # Select a durable production backend; Retain does not replace backups.
  storageClassName: null
  accessModes: [ReadWriteOnce]
  # Every volume is a separate PVC per replica. Each can override storageClassName/accessModes.
  # Existing data must be restored while NiFi is stopped; no automatic migration or resizing.
  # Claim templates are immutable on existing StatefulSets; plan replacement/expansion explicitly.
  volumes:
    flowfile_repository:
      size: 20Gi
    content_repository:
      size: 100Gi
    provenance_repository:
      size: 50Gi
    database_repository:
      size: 5Gi
    state:
      size: 5Gi
    conf:
      # Seeded only when empty; image upgrades never overwrite persisted configuration.
      # Existing PVCs without .nifi-bootstrap-complete require verification and explicit marking.
      size: 5Gi

resources:
  requests:
    cpu: "${NIFI_DOCKER_CPU_MIN}"
    memory: "${NIFI_DOCKER_RAM}"
  limits:
    cpu: "${NIFI_DOCKER_CPU_MAX}"
    memory: "${NIFI_DOCKER_RAM}"

terminationGracePeriodSeconds: 120

