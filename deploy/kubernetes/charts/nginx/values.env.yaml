replicaCount: 1

image:
  repository: cogstacksystems/nifi-nginx
  tag: "latest"
  pullPolicy: Always

nginx:
  internalPort: ${NIFI_INTERNAL_PORT_NGINX}

nifi:
  # Empty uses cogstack-nifi-web.<namespace>.svc.cluster.local; override with a full DNS name.
  host: ""
  port: ${NIFI_INTERNAL_PORT}
  tlsName: ${NIFI_UPSTREAM_TLS_NAME}

tls:
  rootCASecret: cogstack-root-ca
  # NGINX's own tls.crt/tls.key retain the image's existing /certificates/nifi paths.
  existingSecret: nginx-tls

service:
  type: ClusterIP

ingress:
  enabled: false

resources:
  requests:
    cpu: ${NGINX_DOCKER_CPU_MIN}
    memory: 128M
  limits:
    cpu: ${NGINX_DOCKER_CPU_MAX}
    memory: ${NGINX_DOCKER_RAM}
