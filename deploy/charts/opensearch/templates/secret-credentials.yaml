{{- if and .Values.credentials.create (not .Values.credentials.existingSecret) (or .Values.opensearch.enabled .Values.dashboards.enabled) }}
{{- $usersData := include "cogstack-opensearch.parsedUsersEnvFile" . | fromYaml | default (dict) -}}
{{- $adminPassword := .Values.credentials.adminPassword -}}
{{- if hasKey $usersData "OPENSEARCH_INITIAL_ADMIN_PASSWORD" -}}
{{- $adminPassword = index $usersData "OPENSEARCH_INITIAL_ADMIN_PASSWORD" -}}
{{- end -}}
{{- $complianceSalt := .Values.credentials.complianceSalt -}}
{{- if hasKey $usersData "OPENSEARCH_COMPLIANCE_SALT" -}}
{{- $complianceSalt = index $usersData "OPENSEARCH_COMPLIANCE_SALT" -}}
{{- end -}}
{{- $datasourceMasterKey := .Values.credentials.datasourceMasterKey -}}
{{- if hasKey $usersData "OPENSEARCH_DATASOURCE_MASTER_KEY" -}}
{{- $datasourceMasterKey = index $usersData "OPENSEARCH_DATASOURCE_MASTER_KEY" -}}
{{- end -}}
{{- $kibanaUser := .Values.credentials.kibanaUser -}}
{{- if hasKey $usersData "KIBANA_USER" -}}
{{- $kibanaUser = index $usersData "KIBANA_USER" -}}
{{- end -}}
{{- $kibanaPassword := .Values.credentials.kibanaPassword -}}
{{- if hasKey $usersData "KIBANA_PASSWORD" -}}
{{- $kibanaPassword = index $usersData "KIBANA_PASSWORD" -}}
{{- end -}}
{{- if .Values.opensearch.enabled -}}
{{- if or (lt (len $complianceSalt) 16) (regexMatch "[^\\x00-\\x7F]" $complianceSalt) -}}
{{- fail "OPENSEARCH_COMPLIANCE_SALT must contain at least 16 ASCII characters" -}}
{{- end -}}
{{- if or (not (has (len $datasourceMasterKey) (list 16 24 32))) (regexMatch "[^\\x00-\\x7F]" $datasourceMasterKey) -}}
{{- fail "OPENSEARCH_DATASOURCE_MASTER_KEY must contain 16, 24, or 32 ASCII characters" -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cogstack-opensearch.credentialsSecretName" . }}
  labels:
    {{- include "cogstack-opensearch.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.opensearch.enabled }}
  OPENSEARCH_INITIAL_ADMIN_PASSWORD: {{ required "OPENSEARCH_INITIAL_ADMIN_PASSWORD must not be empty" $adminPassword | quote }}
  OPENSEARCH_COMPLIANCE_SALT: {{ required "Set OPENSEARCH_COMPLIANCE_SALT in usersEnvFile.raw or credentials.complianceSalt" $complianceSalt | quote }}
  OPENSEARCH_DATASOURCE_MASTER_KEY: {{ required "Set OPENSEARCH_DATASOURCE_MASTER_KEY in usersEnvFile.raw or credentials.datasourceMasterKey" $datasourceMasterKey | quote }}
  {{- end }}
  {{- if .Values.dashboards.enabled }}
  KIBANA_USER: {{ required "KIBANA_USER must not be empty" $kibanaUser | quote }}
  KIBANA_PASSWORD: {{ required "KIBANA_PASSWORD must not be empty" $kibanaPassword | quote }}
  {{- end }}
{{- end }}
